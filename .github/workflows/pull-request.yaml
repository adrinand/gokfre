name: PR Pipeline

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
        types: [opened, synchronize, reopened, ready_for_review]

jobs:
  version:
    name: Validate version
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          chmod +x gradlew
          VERSION=$(./gradlew -q printVersion)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version '$VERSION' must be a stable X.Y.Z version." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compare with latest release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          set +e
          LATEST_TAG=$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName' 2>/dev/null)
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "Failed to fetch the latest release." >&2
            exit 1
          fi
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "No stable releases found; skipping version comparison."
            exit 0
          fi
          LATEST=${LATEST_TAG#v}
          if ! [[ "$LATEST" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Latest release tag '$LATEST_TAG' is not a stable X.Y.Z version." >&2
            exit 1
          fi

          python3 - "$VERSION" "$LATEST" <<'PY'
          import sys

          version = sys.argv[1]
          latest = sys.argv[2]

          def parse(value):
              return tuple(int(part) for part in value.split("."))

          if parse(version) <= parse(latest):
              print(
                  f"Version {version} must be greater than the latest release {latest}.",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"Version {version} is greater than the latest release {latest}.")
          PY

  linux-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/ci-build

  macos-build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/ci-build