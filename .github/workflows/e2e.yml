name: E2E Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ matrix.environment }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: linux-gnome
            runner: ubuntu-latest
            setup-script: setup-e2e-linux-gnome.sh
          - environment: linux-kde
            runner: ubuntu-latest
            setup-script: setup-e2e-linux-kde.sh
          - environment: macos-silicon
            runner: macos-latest
            setup-script: setup-e2e-macos.sh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Rust (Linux)
        if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up desktop environment
        timeout-minutes: 15
        run: bash .github/scripts/${{ matrix.setup-script }}

      - name: Run E2E tests
        timeout-minutes: 20
        run: ./gradlew e2e --no-daemon --stacktrace

      - name: Show E2E failures
        if: failure()
        run: |
          for f in build/test-results/e2e/*.xml; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            grep -oE '<testcase name="[^"]*"[^>]*>|<failure message="[^"]*"' "$f" || true
          done

      - name: Upload E2E reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports-${{ matrix.environment }}
          path: |
            build/reports/tests/e2e/
            build/test-results/e2e/
            lib/gokfre-hotkey/target/
            hs_err_pid*.log
            /tmp/kwin.log
            /tmp/gnome-shell.log
          if-no-files-found: ignore
